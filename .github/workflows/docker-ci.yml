name: Docker Build Check

on:
  push:
    branches: [ "**" ] # Se ejecuta en cualquier rama
  pull_request:
    branches: [ "main" ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Build del Backend
        uses: docker/build-push-action@v5
        with:
          context: ./app-stack/backend
          file: ./app-stack/backend/Dockerfile
          push: false

      - name: Validar Build del Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app-stack/frontend
          file: ./app-stack/frontend/Dockerfile
          push: false