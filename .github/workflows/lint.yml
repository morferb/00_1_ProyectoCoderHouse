name: Python Code Quality

on:
  push:
    branches: [ "**" ] # Se ejecuta en cualquier rama
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar linter (Ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Analizar código con Ruff
        run: |
          ruff check 001-Inventario-MVP/