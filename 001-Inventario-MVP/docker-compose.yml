#version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventario_db_prod
    hostname: db_host
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
#---
    # env_file:
    #   - .env
#---
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_vol:/var/lib/postgresql/data
    networks:
      - LAB_TYMA
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # test: ["CMD-SHELL", "pg_isready -U postgres -d inventario_ti"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: inventario_ti_api:latest
    container_name: inventario_api_prod
    hostname: api_host
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # - DATABASE_URL=postgresql://postgres:password@db_host:5432/inventario_ti
    depends_on:
      db:
        condition: service_healthy
    networks:
      - LAB_TYMA


volumes:
  postgres_data_vol:
    name: inventario_postgres_data

networks:
  LAB_TYMA:
    external: true